<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | GlobeTrek Adventures</title>

    <!-- Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="login.css">
</head>

<body>

    <!-- Header -->
    <header class="login-header">
        <a href="index.html" class="globetrek-logo">
            <img src="logo trans.png" alt="GlobeTrek Adventures">
        </a>
    </header>


    <!-- Login Section -->
    <section class="auth-section">

        <div class="auth-overlay"></div>

        <div class="container">
            <div class="row justify-content-center align-items-center min-vh-100">

                <div class="col-lg-5 col-md-7 col-sm-10">

                    <div class="auth-card">

                        <div class="auth-title">
                            <h1>Welcome Back</h1>
                            <p>Sign in to continue your journey with GlobeTrek.</p>
                        </div>

                    
                        <form action="login.php" method="POST">

                            <!-- Email -->
                            <div class="form-group">
                                <label for="email">Email Address</label>

                                <div class="input-box">
                                    <i class="bi bi-envelope"></i>

                                    <input
                                        type="email"
                                        id="email"
                                        name="email"
                                        placeholder="Enter your email"
                                        required>
                                </div>
                            </div>


                            <!-- Password -->
                            <div class="form-group">
                                <label for="password">Password</label>

                                <div class="input-box">
                                    <i class="bi bi-lock"></i>

                                    <input
                                        type="password"
                                        id="password"
                                        name="password"
                                        placeholder="Enter your password"
                                        required>

                                    <i class="bi bi-eye password-toggle"
                                       onclick="togglePassword()"></i>
                                </div>
                            </div>


                            <!-- Remember / Forgot -->
                            <div class="login-options">

                                <div>
                                    <input type="checkbox" id="remember">
                                    <label for="remember">Remember me</label>
                                </div>

                                <a href="#">Forgot Password?</a>

                            </div>


                            <!-- Login Button -->
                            <button type="submit" class="auth-btn">
                                Sign In
                            </button>


                            <!-- Register -->
                            <div class="auth-footer">
                                <p>
                                    Don't have an account?
                                    <a href="register.html">Create Account</a>
                                </p>
                            </div>

                        </form>

                    </div>

                </div>

            </div>
        </div>

    </section>


    <script>
        function togglePassword() {

            const password = document.getElementById("password");

            if (password.type === "password") {
                password.type = "text";
            } else {
                password.type = "password";
            }
        }
    </script>

</body>
</html>
