<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | GlobeTrek Adventures</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="register.css">
</head>

<body>

    <!-- Background -->
    <div class="register-page">

        <!-- Dark Overlay -->
        <div class="background-overlay"></div>

        <!-- Header -->
        <header class="register-header">

            <a href="index.html" class="logo">
                <img src="logo trans.png" alt="GlobeTrek Adventures">
            </a>

            <a href="index.html" class="home-btn">
                <i class="bi bi-house"></i>
                Home
            </a>

        </header>


        <!-- Registration Section -->
        <main class="register-container">

            <div class="register-card">

                <!-- Heading -->
                <div class="register-heading">

                    <h1>Create Your Account</h1>

                    <p>
                        Join GlobeTrek Adventures and start your journey.
                    </p>

                </div>


                <!-- Registration Form -->
                 <form id="registerForm" action="registration.php" method="POST">
                    <!-- Name -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="firstName">
                                First Name
                            </label>

                            <div class="input-box">
                                <i class="bi bi-person"></i>

                                <input
                                    type="text"
                                    id="firstName"
                                    name="firstName"
                                    placeholder="Enter your first name"
                                    required>
                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label for="lastName">
                                Last Name
                            </label>

                            <div class="input-box">
                                <i class="bi bi-person"></i>

                                <input
                                    type="text"
                                    id="lastName"
                                    name="lastName"
                                    placeholder="Enter your last name"
                                    required>
                            </div>

                        </div>

                    </div>


                    <!-- Email -->
                    <div class="mb-3">

                        <label for="email">
                            Email Address
                        </label>

                        <div class="input-box">

                            <i class="bi bi-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter your email address"
                                required>

                        </div>

                    </div>


                    <!-- Phone + Country -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="phone">
                                Phone Number
                            </label>

                            <div class="input-box">

                                <i class="bi bi-telephone"></i>

                                <input
                                    type="tel"
                                    id="phone"
                                    name="phone"
                                    placeholder="Enter phone number"
                                    required>

                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label for="country">
                                Country
                            </label>

                            <div class="input-box">

                                <i class="bi bi-globe"></i>

                                <select
                                    id="country"
                                    name="country"
                                    required>

                                    <option value="" selected disabled>
                                        Select your country
                                    </option>

                                    <option value="Sri Lanka">
                                        Sri Lanka
                                    </option>

                                    <option value="India">
                                        India
                                    </option>

                                    <option value="United Kingdom">
                                        United Kingdom
                                    </option>

                                    <option value="United States">
                                        United States
                                    </option>

                                    <option value="Australia">
                                        Australia
                                    </option>

                                    <option value="Canada">
                                        Canada
                                    </option>

                                    <option value="Germany">
                                        Germany
                                    </option>

                                    <option value="France">
                                        France
                                    </option>

                                    <option value="Japan">
                                        Japan
                                    </option>

                                    <option value="Other">
                                        Other
                                    </option>

                                </select>

                            </div>

                        </div>

                    </div>


                    <!-- Password -->
                    <div class="row">

                        <div class="col-md-6 mb-3">

                            <label for="password">
                                Password
                            </label>

                            <div class="input-box">

                                <i class="bi bi-lock"></i>

                                <input
                                    type="password"
                                    id="password"
                                    name="password"
                                    placeholder="Create a password"
                                    required>

                                <button
                                    type="button"
                                    class="password-toggle"
                                    onclick="togglePassword('password', this)">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>


                        <div class="col-md-6 mb-3">

                            <label for="confirmPassword">
                                Confirm Password
                            </label>

                            <div class="input-box">

                                <i class="bi bi-lock"></i>

                                <input
                                    type="password"
                                    id="confirmPassword"
                                    name="confirmPassword"
                                    placeholder="Confirm your password"
                                    required>

                                <button
                                    type="button"
                                    class="password-toggle"
                                    onclick="togglePassword('confirmPassword', this)">

                                    <i class="bi bi-eye"></i>

                                </button>

                            </div>

                        </div>

                    </div>


                    <!-- Terms -->
                    <div class="terms">

                        <input
                            type="checkbox"
                            id="terms"
                            required>

                        <label for="terms">
                            I agree to the
                            <a href="#">Terms & Conditions</a>
                            and
                            <a href="#">Privacy Policy</a>.
                        </label>

                    </div>


                    <!-- Register Button -->
                    <button
                        type="submit"
                        class="register-btn">

                        <i class="bi bi-person-plus"></i>

                        Create Account

                    </button>


                    <!-- Login -->
                    <div class="login-link">

                        Already have an account?

                        <a href="login.html">
                            Sign In
                        </a>

                    </div>

                </form>

            </div>

        </main>

    </div>


  

</body>

</html>
